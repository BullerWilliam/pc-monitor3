<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PcMonitor3 Access</title>
    <link rel="stylesheet" href="../shared/styles.css" />
  </head>
  <body class="access">
    <main class="shell">
      <section class="panel">
        <p class="eyebrow">Access app</p>
        <h1>PcMonitor3 Access</h1>
        <div class="pairing-code" id="pairingCode">------</div>
        <p class="muted">Use this pairing code in the monitor app on the admin PC.</p>
        <div class="status-grid">
          <div>
            <span>HTTP status</span>
            <strong id="statusUrl">Starting...</strong>
          </div>
          <div>
            <span>Screen stream</span>
            <strong id="streamUrl">Starting...</strong>
          </div>
          <div>
            <span>Remote consent</span>
            <strong id="remoteState">Off</strong>
          </div>
          <div>
            <span>Firebase</span>
            <strong id="firebaseState">Checking...</strong>
          </div>
        </div>
        <div class="actions">
          <button id="startupButton">Install startup</button>
          <button class="ghost" id="uninstallButton">Uninstall local state</button>
        </div>
      </section>
      <section class="preview-panel">
        <img id="preview" alt="Live screen preview" />
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
